<div
  class="figure-search-backdrop"
  data-popup-motion="modal"
  tabindex="-1"
  (click)="closeSearch.emit()"
  (keydown)="onBackdropKeydown($event)">
  <section class="figure-search-panel" data-popup-panel (click)="$event.stopPropagation()" (keydown)="onKeydown($event)">
    <div class="figure-search-field">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path [attr.d]="iconPath('search')"></path>
      </svg>
      <input
        #searchInput
        type="search"
        [attr.aria-label]="placeholder()"
        [value]="query()"
        [placeholder]="placeholder()"
        (input)="updateQuery($any($event.target).value)" />
      <button
        class="figure-search-field__clear"
        type="button"
        [class.is-visible]="query()"
        [attr.aria-label]="clearLabel()"
        (click)="clearQuery($event)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="iconPath('close')"></path>
        </svg>
      </button>
      <kbd>{{ shortcutLabel() }}</kbd>
    </div>

    <div class="figure-search-results">
      @if (filteredPresets().length) {
        @for (preset of filteredPresets(); track trackByPresetId($index, preset)) {
          <button
            #resultButton
            class="figure-search-result"
            type="button"
            [class.is-active]="$index === activeIndex()"
            (mouseenter)="activeIndex.set($index)"
            (click)="choosePreset(preset)">
            <span class="figure-search-result__icon">
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                [style.width.px]="preset.iconWidth ?? null"
                [style.stroke-width]="preset.iconStrokeWidth ?? null">
                <path [attr.d]="iconPath(preset.icon)"></path>
              </svg>
            </span>
            <span class="figure-search-result__copy">
              <strong>{{ titleForPreset()(preset) }}</strong>
              <small>{{ descriptionForPreset()(preset) }}</small>
            </span>
            @if (shortcutForPreset()(preset); as shortcut) {
              <kbd class="figure-search-result__shortcut">{{ shortcut }}</kbd>
            }
          </button>
        }
      } @else {
        <div class="figure-search-empty">{{ noResultsLabel() }}</div>
      }
    </div>
  </section>
</div>
