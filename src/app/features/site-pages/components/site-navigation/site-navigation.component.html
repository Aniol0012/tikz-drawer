<header class="site-header" data-tooltip-disabled>
  <div class="site-header__inner">
    <a class="brand" routerLink="/">TikZ Drawer</a>

    <nav class="site-nav" [attr.aria-label]="'site.navigation.documentation' | translate">
      <a routerLink="/guide" [attr.aria-current]="activePage() === 'guide' ? 'page' : null">{{ 'site.navigation.guide' | translate }}</a>
      <a routerLink="/examples" [attr.aria-current]="activePage() === 'examples' ? 'page' : null">{{
        'site.navigation.examples' | translate
      }}</a>
      <a routerLink="/about" [attr.aria-current]="activePage() === 'about' ? 'page' : null">{{ 'site.navigation.about' | translate }}</a>
    </nav>

    <div class="header-actions">
      <app-language-selector [chevronIconPath]="chevronIconPath" />
      <app-theme-toggle-button
        [theme]="theme()"
        [label]="theme() === 'dark' ? ('site.navigation.useLightTheme' | translate) : ('site.navigation.useDarkTheme' | translate)"
        (themeToggle)="toggleTheme()" />

      <a class="editor-link" routerLink="/">{{ 'site.navigation.openEditor' | translate }}</a>
    </div>
  </div>
</header>
