<header class="site-header" data-tooltip-disabled>
  <div class="site-header__inner">
    <a class="brand" routerLink="/">TikZ Drawer</a>

    <div class="header-actions">
      <nav class="site-nav" aria-label="Documentation">
        <a routerLink="/guide" [attr.aria-current]="activePage() === 'guide' ? 'page' : null">Guide</a>
        <a routerLink="/examples" [attr.aria-current]="activePage() === 'examples' ? 'page' : null">Examples</a>
        <a routerLink="/about" [attr.aria-current]="activePage() === 'about' ? 'page' : null">About</a>
      </nav>

      <app-theme-toggle-button
        [theme]="theme()"
        [label]="theme() === 'dark' ? 'Use light theme' : 'Use dark theme'"
        (themeToggle)="toggleTheme()" />

      <a class="editor-link" routerLink="/">Open editor</a>
    </div>
  </div>
</header>
