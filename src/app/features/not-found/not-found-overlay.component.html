<dialog
  #dialog
  class="not-found-dialog"
  data-tooltip-disabled
  aria-labelledby="not-found-dialog-title"
  aria-describedby="not-found-dialog-description"
  (click)="onBackdropClick($event)"
  (close)="dismissed.emit()">
  <section class="dialog-panel">
    <header class="dialog-header">
      <div class="dialog-mark" aria-hidden="true">
        <span></span>
        <span></span>
      </div>
      <button type="button" aria-label="Close message" (click)="close()">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="m4 4 8 8m0-8-8 8" />
        </svg>
      </button>
    </header>

    <div class="dialog-body">
      <h2 id="not-found-dialog-title">We can’t find this page</h2>
      <p id="not-found-dialog-description">
        This link seems to have lost its coordinates. Close this message to keep working where you were.
      </p>
      <div class="requested-path">
        <span>You tried to open</span>
        <code>{{ requestedPath() }}</code>
      </div>
    </div>

    <footer class="dialog-actions">
      <button class="button" type="button" autofocus (click)="close()">Continue here</button>
      <a class="button button--primary" routerLink="/" (click)="dismissed.emit()">Open editor</a>
    </footer>
  </section>
</dialog>
