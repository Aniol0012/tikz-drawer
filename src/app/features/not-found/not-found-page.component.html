<div class="not-found-page" data-tooltip-disabled>
  <a class="brand" routerLink="/">TikZ Drawer</a>

  <section class="message" aria-labelledby="not-found-title">
    <div class="message__copy">
      <h1 id="not-found-title">{{ 'notFound.title' | translate }}</h1>
      <p class="explanation">{{ 'notFound.explanation' | translate }}</p>
      <code>{{ requestedPath }}</code>
      <div class="actions">
        <app-action-link [label]="'notFound.openEditor' | translate" route="/" [iconPath]="editorIconPath" tone="primary" />
        <app-action-link [label]="'notFound.readGuide' | translate" route="/guide" [iconPath]="guideIconPath" />
      </div>
    </div>

    <app-diagram-artwork kind="lost" [label]="'notFound.artworkLabel' | translate" [interactive]="true" />
  </section>
</div>
