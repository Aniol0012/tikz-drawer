<svg viewBox="0 0 320 220" role="img" [attr.aria-label]="label()">
  <rect class="artwork-surface" x="1" y="1" width="318" height="218" rx="10" />
  <g class="artwork-grid" aria-hidden="true">
    <path d="M0 55h320M0 110h320M0 165h320M64 0v220M128 0v220M192 0v220M256 0v220" />
  </g>

  @switch (kind()) {
    @case ('canvas') {
      <g class="layer layer--back">
        <path class="plane plane--muted" d="m53 126 91-52 121 69-91 52z" />
        <path class="plane plane--accent" d="m72 106 76-43 93 53-76 44z" />
      </g>
      <g class="layer layer--front">
        <rect class="node" x="93" y="80" width="58" height="34" rx="5" />
        <rect class="node node--accent" x="181" y="130" width="58" height="34" rx="5" />
        <path class="connector" d="m151 97 31 18 18 10" />
        <path class="arrow" d="m194 119 8 7-10 1" />
        <circle class="handle" cx="93" cy="80" r="4" />
        <circle class="handle" cx="151" cy="114" r="4" />
      </g>
    }
    @case ('gallery') {
      <g class="layer layer--front">
        <rect class="tile" x="39" y="39" width="108" height="62" rx="7" />
        <rect class="tile" x="173" y="39" width="108" height="62" rx="7" />
        <rect class="tile" x="39" y="119" width="108" height="62" rx="7" />
        <rect class="tile" x="173" y="119" width="108" height="62" rx="7" />
        <path class="connector" d="M61 70h28m12 0h24M197 70l15-14 17 27 24-23M61 150h25l12-17 25 33M198 151h57" />
        <circle class="node--accent" cx="94" cy="70" r="7" />
        <circle class="node" cx="198" cy="151" r="8" />
        <circle class="node" cx="226" cy="151" r="8" />
        <circle class="node--accent" cx="255" cy="151" r="8" />
      </g>
    }
    @case ('flowchart') {
      <g class="layer layer--front">
        <rect class="node node--accent" x="107" y="31" width="106" height="38" rx="18" />
        <rect class="node" x="107" y="92" width="106" height="38" rx="5" />
        <path class="node" d="m160 151 43 24-43 24-43-24z" />
        <path class="connector" d="M160 69v23m0 38v21" />
        <path class="arrow" d="m154 84 6 8 6-8m-12 59 6 8 6-8" />
      </g>
    }
    @case ('graph') {
      <g class="layer layer--front">
        <path class="connector" d="m79 151 48-87 79 12 42 79-92 29zM127 64l29 120m50-108-50 108M79 151l169 4" />
        <circle class="node node--accent" cx="127" cy="64" r="13" />
        <circle class="node" cx="206" cy="76" r="13" />
        <circle class="node" cx="248" cy="155" r="13" />
        <circle class="node node--accent" cx="156" cy="184" r="13" />
        <circle class="node" cx="79" cy="151" r="13" />
      </g>
    }
    @case ('architecture') {
      <g class="layer layer--back">
        <path class="plane plane--muted" d="m44 157 75-43 61 35-75 43z" />
        <path class="plane plane--muted" d="m141 100 75-43 61 35-75 43z" />
      </g>
      <g class="layer layer--front">
        <path class="cube cube--accent" d="m57 132 43-25 37 21-43 25zm0 0v31l37 22v-32m43-45v31l-43 25" />
        <path class="cube" d="m166 77 43-25 43 25-43 25zm0 0v39l43 25v-39m43-25v39l-43 25" />
        <path class="connector" d="m130 128 38-22" />
      </g>
    }
    @case ('geometry') {
      <g class="layer layer--front">
        <circle class="geometry-circle" cx="160" cy="113" r="70" />
        <path class="connector connector--strong" d="m101 150 62-105 57 108zM101 150l119 3" />
        <path class="accent-line" d="M160 113h60M160 113l-59 37" />
        <circle class="handle" cx="160" cy="113" r="5" />
        <circle class="handle" cx="101" cy="150" r="5" />
        <circle class="handle" cx="220" cy="153" r="5" />
      </g>
    }
    @case ('network') {
      <g class="layer layer--back connector connector--soft">
        <path d="M75 55l85 29 84-29M75 110l85-26 84 26M75 165l85-81 84 81M75 55l85 84 84-84M75 110l85 29 84-29M75 165l85-26 84 26" />
      </g>
      <g class="layer layer--front">
        <circle class="node" cx="75" cy="55" r="11" />
        <circle class="node node--accent" cx="75" cy="110" r="11" />
        <circle class="node" cx="75" cy="165" r="11" />
        <circle class="node node--accent" cx="160" cy="84" r="11" />
        <circle class="node" cx="160" cy="139" r="11" />
        <circle class="node node--accent" cx="244" cy="55" r="11" />
        <circle class="node" cx="244" cy="110" r="11" />
        <circle class="node node--accent" cx="244" cy="165" r="11" />
      </g>
    }
    @case ('annotation') {
      <g class="layer layer--back">
        <rect class="image-frame" x="50" y="37" width="220" height="146" rx="7" />
        <path class="image-shape" d="m67 161 50-55 35 31 39-53 62 77z" />
        <circle class="image-sun" cx="220" cy="70" r="16" />
      </g>
      <g class="layer layer--front">
        <path class="accent-line" d="M95 75h58m-8-8 8 8-8 8" />
        <rect class="label-chip" x="66" y="58" width="65" height="25" rx="4" />
        <path class="connector" d="m195 141 34-26" />
        <circle class="handle" cx="195" cy="141" r="5" />
      </g>
    }
    @case ('source') {
      <g class="layer layer--back">
        <rect class="code-window" x="40" y="31" width="240" height="158" rx="8" />
        <path class="window-bar" d="M40 62h240" />
        <circle class="window-dot" cx="60" cy="47" r="4" />
        <circle class="window-dot" cx="74" cy="47" r="4" />
      </g>
      <g class="layer layer--front code-lines">
        <path d="M66 86h92m-92 20h157m-157 20h128m-128 20h171m-171 20h74" />
        <path class="accent-line" d="M174 86h63m-21 60h21" />
      </g>
    }
    @case ('lost') {
      <g class="layer layer--front">
        <rect class="selection-frame" x="46" y="56" width="228" height="112" rx="8" />
        <text class="error-code" x="160" y="140" text-anchor="middle">404</text>
        <circle class="handle" cx="46" cy="56" r="5" />
        <circle class="handle" cx="274" cy="56" r="5" />
        <circle class="handle" cx="46" cy="168" r="5" />
        <circle class="handle" cx="274" cy="168" r="5" />
        <path class="connector connector--dashed" d="M274 83h22v-25" />
        <path class="accent-line" d="m289 65 7-7 7 7" />
      </g>
    }
  }
</svg>
